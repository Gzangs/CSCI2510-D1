<html>

<head>
    <title>
        Drawing Test
    </title>
    <style>
        *{
            margin:0;
            overflow: hidden;
        }

    </style>
</head>

<body>
    <canvas id="canv">

    </canvas>
    <script src="Vector2.js"></script>
    <script>
        let canvas = document.querySelector("#canv")
        let ctx = canvas.getContext("2d")

        let position = new Vector2(50, 50)

        function gameLoop() {
            update()
            draw()
            requestAnimationFrame(gameLoop)
        }

        function update() {
            position.x = position.x + 2
        }

        function draw() {

            //expand size of canvas
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

            //singaling to context that i will draw something
            ctx.save()

            //set center of object, trasnlate is algebra definition
            ctx.translate(position.x, position.y)

            /* ctx.lineTo(0, -90) triangle shape
            ctx.lineTo(-90, 90)
            ctx.lineTo(90, -120)
            ctx.lineTo(-20, 30)
            ctx.lineTo(90, 20) */

            //half bat
            ctx.lineTo(0, -20)
            ctx.lineTo(10, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(50, -40)
            ctx.lineTo(60, -50)
            ctx.lineTo(55, 0)
            ctx.lineTo(0, 40)

            ctx.fillStyle = "black"
            ctx.fill()

            //signaling done drawing
            ctx.restore()
        }

        requestAnimationFrame(gameLoop)

    </script>
</body>

</html>
