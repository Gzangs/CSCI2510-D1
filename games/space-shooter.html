<html>

<head>
    <title>
        Drawing Test
    </title>
    <style>
        *{
            margin:0;
            overflow: hidden;
        }

    </style>
</head>

<body>
    <canvas id="canv">

    </canvas>
    <script src="../engine/Vector2.js"></script> //go up one folder and go down into engine folder to find Vector2
    <script src="../engine/Input.js"></script>
    <script src="../engine/Engine.js"></script>
    <script>
        let position = new Vector2(50, 50)

        function update() {
            console.log(Input.keysDown)

            if(Input.keysDown.includes("ArrowRight")){
            position.x = position.x + 2
            }
            if(Input.keysDown.includes("ArrowLeft")){
            position.x = position.x - 2
            }
            if(Input.keysDown.includes("ArrowUp")){
            position.y = position.y - 2
            }
            if(Input.keysDown.includes("ArrowDown")){
            position.y = position.y + 2
            }
        }

        function draw(ctx) {
            //singaling to context that i will draw something
            ctx.save()

            //set center of object, trasnlate is algebra definition
            ctx.translate(position.x, position.y)

            /* ctx.lineTo(0, -90) triangle shape
            ctx.lineTo(-90, 90)
            ctx.lineTo(90, -120)
            ctx.lineTo(-20, 30)
            ctx.lineTo(90, 20) */

            //half bat
            ctx.lineTo(0, -20)
            ctx.lineTo(10, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(50, -40)
            ctx.lineTo(60, -50)
            ctx.lineTo(55, 0)
            ctx.lineTo(0, 40)

            ctx.fillStyle = "black"
            ctx.fill()

            //signaling done drawing
            ctx.restore()
        }

        Engine.start()

    </script>
</body>

</html>
